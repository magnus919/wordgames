name: Feature proposal
description: Propose a new game or improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Player need and proposed experience
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and testing
      description: Consider solvability, accessibility, saved progress, spoilers and content provenance.
    validations:
      required: true
