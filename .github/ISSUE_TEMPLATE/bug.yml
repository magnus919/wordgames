name: Bug report
description: Report incorrect behavior or a broken puzzle.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include game, puzzle date, browser/device and reproducible steps. Avoid personal data and credentials.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, errors or a minimal test. Mark puzzle answers as spoilers.
